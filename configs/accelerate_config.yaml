# ─────────────────────────────────────────────────────────────
# Accelerate configuration for 4-GPU DDP training
#
# Usage:
#   accelerate launch --config_file configs/accelerate_config.yaml src/train.py ...
#
# Or set as default:
#   cp configs/accelerate_config.yaml ~/.cache/huggingface/accelerate/default_config.yaml
# ─────────────────────────────────────────────────────────────

compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU

# Number of GPUs to use (matches nvidia-smi: 4x RTX 5090)
num_processes: 4
num_machines: 1
machine_rank: 0

# GPU IDs to use — "all" uses GPU 0,1,2,3 in order
gpu_ids: all

# Mixed precision — must match training.mixed_precision in train_config.yaml
mixed_precision: bf16
downcast_bf16: "no"

# Process group backend: nccl is required for GPU-to-GPU communication
main_process_port: 29500
rdzv_backend: static
same_network: true

main_training_function: main

tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
