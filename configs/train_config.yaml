# ─────────────────────────────────────────────
# Fine-tuning configuration for Stable Diffusion
# Inpainting on Interior-Design dataset
# ─────────────────────────────────────────────

model:
  pretrained_model_name_or_path: "runwayml/stable-diffusion-inpainting"
  # Alternative: "stabilityai/stable-diffusion-2-inpainting"
  revision: null
  variant: null

lora:
  enabled: true          # set false for full fine-tuning
  rank: 16               # LoRA rank; higher = more capacity, more memory
  alpha: 32              # LoRA scaling factor (alpha / rank = scale)
  dropout: 0.05
  # Modules to apply LoRA to inside the UNet
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "proj_in"
    - "proj_out"
    - "ff.net.0.proj"
    - "ff.net.2"

data:
  dataset_dir: "data/interior"          # root directory of processed dataset
  train_split: "train"
  val_split: "val"
  image_size: 512                        # training resolution (512 or 768)
  center_crop: false
  random_flip: true
  mask_type: "mixed"   # "bbox" | "irregular" | "object" | "mixed"
  # Fraction of mask area relative to image; helps the model focus on objects
  mask_min_area: 0.05
  mask_max_area: 0.50
  # Caption template used when no per-image caption is available
  default_caption: "A high-quality interior design photo"
  num_workers: 4

training:
  output_dir: "outputs/interior-inpainting"
  seed: 42
  resolution: 512
  train_batch_size: 2
  gradient_accumulation_steps: 4        # effective batch = 2 × 4 = 8
  num_train_epochs: 50
  max_train_steps: null                  # if set, overrides num_train_epochs
  checkpointing_steps: 500
  resume_from_checkpoint: "latest"      # path or "latest"
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  lr_warmup_steps: 200
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  mixed_precision: "fp16"               # "no" | "fp16" | "bf16"
  gradient_checkpointing: true          # saves VRAM at slight speed cost
  use_8bit_adam: false                  # requires bitsandbytes
  enable_xformers: true

validation:
  validation_steps: 500
  num_validation_images: 4
  # Provide a few prompt + image + mask triplets for qualitative tracking
  validation_prompts:
    - "a modern living room with a white sofa and wooden floor"
    - "a minimalist bedroom with natural lighting"
    - "a cozy dining room with a round oak table"
    - "a contemporary kitchen with marble countertops"

logging:
  report_to: "wandb"   # "wandb" | "tensorboard" | "none"
  run_name: "sd-inpainting-interior-lora"
  log_every_n_steps: 50

push_to_hub:
  enabled: false
  hub_model_id: null
  hub_token: null
